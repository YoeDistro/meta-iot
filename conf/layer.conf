# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-iot"
BBFILE_PATTERN_meta-iot := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-iot = "7"

LAYERDEPENDS_meta-iot = "core"
LAYERSERIES_COMPAT_meta-iot = "scarthgap styhead walnascar whinlatter wrynose"
